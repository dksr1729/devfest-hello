
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal To-Do</title>
  <style>
    body { background: #121212; color: #fff; font-family: monospace; padding: 20px; max-width: 400px; margin: auto; }
    h2 { color: #00e676; text-align: center; }
    .input-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
    button { padding: 10px 16px; background: #00e676; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    ul { list-style: none; padding: 0; }
    li { background: #1e1e1e; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; border-radius: 4px; align-items: center; }
    .del-btn { background: #ff5252; color: #fff; padding: 4px 8px; border: none; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>TASKS</h2>
  <div class="input-box">
    <input type="text" id="taskInput" placeholder="Add new task...">
    <button onclick="addTask()">ADD</button>
  </div>
  <ul id="taskList"></ul>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    
    function render() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, i) => {
        list.innerHTML += `<li><span>${task}</span><button class="del-btn" onclick="removeTask(${i})">X</button></li>`;
      });
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      if (input.value.trim()) {
        tasks.push(input.value.trim());
        input.value = '';
        render();
      }
    }

    function removeTask(i) {
      tasks.splice(i, 1);
      render();
    }

    render();
  </script>
</body>
</html>
